<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <title>WebQuiz</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>Questions</h1>
    <h3>
        Set:
        <span id="setName" th:text="${set.name}"></span>

    <div id="response">Loading...</div>

</div>

<script src="/script_modify_set.js"></script>
</body>
</html>
