<!DOCTYPE html>
<html lang="en">
<head>
  <title>WebQuiz</title>
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<div>

  <h1>
    Hello
    <span th:text="${username}"></span>
  </h1>


  <div class="container">
    <h3>
      You scored:
      <span id="score" th:text="${score}"></span>
      /
      <span id="out" th:text="${maxPoints}"></span>
    </h3>

    <hr>

    <button onclick="window.location.href='/home'">Finish</button>

  </div>
</div>


</body>
</html>
